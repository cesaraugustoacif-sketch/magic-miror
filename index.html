<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi MagicMirror HTML</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    /* Contenedor principal */
    #container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px;
    }

    #left, #center, #right {
      flex: 1;
      text-align: left;
    }

    /* Reloj */
    #clock {
      font-size: 80px;
      text-align: center;
    }

    /* Clima con animación */
    #weather {
      font-size: 44px;
      text-align: right;
      animation: fadeInRight 2s ease-in-out;
    }

    /* Compliments */
    #compliments {
      font-size: 28px;
      text-align: left;
      margin-top: 40px;
    }

    /* Noticias y calendario abajo */
    #bottom {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.6);
      padding: 10px;
    }

    #news, #calendar {
      font-size: 40px;
      margin: 5px;
    }

    /* Animación para el clima */
    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="left">
      <div id="clock"></div>
    </div>
    <div id="center">
      <div id="compliments"></div>
    </div>
    <div id="right">
      <div id="weather"></div>
    </div>
  </div>

  <div id="bottom">
    <div id="news"></div>
    <div id="calendar"></div>
  </div>

  <script>
    // 🔹 Reloj
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 🔹 Clima con Open-Meteo (Bogotá)
    async function loadWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=4.7110&longitude=-74.0721&current_weather=true");
        if (!res.ok) throw new Error(`Error del servicio de clima: ${res.status}`);
        const data = await res.json();
        const w = data.current_weather;
        if (!w || !Number.isFinite(w.temperature) || !Number.isFinite(w.windspeed)) {
          throw new Error("Respuesta de clima incompleta");
        }
        document.getElementById("weather").innerText =
          `Bogotá: ${w.temperature}°C, viento ${w.windspeed} km/h`;
      } catch (e) {
        console.error("No se pudo cargar el clima:", e);
        document.getElementById("weather").innerText = "No se pudo cargar el clima.";
      }
    }
    loadWeather();

    // 🔹 Noticias (ejemplo con El País RSS)
    async function loadNews() {
      try {
        const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada");
        if (!res.ok) throw new Error(`Error del servicio de noticias: ${res.status}`);
        const data = await res.json();
        if (data.status !== "ok" || !Array.isArray(data.items) ||
            !data.items[0] || typeof data.items[0].title !== "string" || !data.items[0].title.trim()) {
          throw new Error("No hay noticias disponibles en la respuesta");
        }
        document.getElementById("news").innerText = "Noticias: " + data.items[0].title;
      } catch (e) {
        console.error("No se pudieron cargar las noticias:", e);
        document.getElementById("news").innerText = "No se pudieron cargar las noticias.";
      }
    }
    loadNews();

    // 🔹 Festivos nacionales de Colombia (Nager.Date)
    async function loadCalendar() {
      try {
        const dateParts = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/Bogota", year: "numeric", month: "2-digit", day: "2-digit"
        }).formatToParts(new Date());
        const part = type => dateParts.find(item => item.type === type).value;
        const today = `${part("year")}-${part("month")}-${part("day")}`;
        const year = Number(part("year"));
        const responses = await Promise.all([year, year + 1].map(async currentYear => {
          const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear}/CO`);
          if (!res.ok) throw new Error(`Error del servicio de festivos: ${res.status}`);
          const holidays = await res.json();
          if (!Array.isArray(holidays) || !holidays.every(holiday =>
            holiday && /^\d{4}-\d{2}-\d{2}$/.test(holiday.date) &&
            typeof holiday.localName === "string" && typeof holiday.global === "boolean")) {
            throw new Error("Respuesta de festivos inválida");
          }
          return holidays;
        }));
        const upcoming = responses.flat()
          .filter(holiday => holiday.global && holiday.date >= today)
          .sort((a, b) => a.date.localeCompare(b.date))
          .slice(0, 5);
        if (upcoming.length === 0) throw new Error("No hay próximos festivos disponibles");
        const formatter = new Intl.DateTimeFormat("es-CO", { timeZone: "UTC" });
        const lines = upcoming.map(holiday =>
          `${formatter.format(new Date(`${holiday.date}T00:00:00Z`))} - ${holiday.localName}`);
        document.getElementById("calendar").innerText = "Próximos festivos:\n" + lines.join("\n");
      } catch (e) {
        console.error("No se pudo cargar el calendario:", e);
        document.getElementById("calendar").innerText = "No se pudo cargar el calendario.";
      }
    }
    loadCalendar();

    // 🔹 Compliments
    const compliments = {
      anytime: [
        "¡Qué bien te ves hoy!",
        "Sigue adelante, lo estás logrando.",
        "Hoy será un gran día."
      ],
      morning: [
        "Buenos días, ¡a brillar!",
        "El café sabe mejor con tu energía.",
        "Empieza el día con una sonrisa."
      ],
      afternoon: [
        "La tarde es perfecta para avanzar.",
        "Tu esfuerzo vale la pena.",
        "¡Qué buena vibra tienes!"
      ],
      evening: [
        "Descansa, te lo mereces.",
        "Hoy hiciste un gran trabajo.",
        "Relájate y disfruta la noche."
      ]
    };

    function getCompliment() {
      const hour = new Date().getHours();
      let list;
      if (hour < 12) list = compliments.morning;
      else if (hour < 18) list = compliments.afternoon;
      else list = compliments.evening;
      list = list.concat(compliments.anytime);
      const phrase = list[Math.floor(Math.random() * list.length)];
      document.getElementById("compliments").innerText = phrase;
    }
    setInterval(getCompliment, 10000);
    getCompliment();
  </script>
</body>
</html>
